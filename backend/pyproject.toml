[project]
name = "devbrief"
version = "0.1.0"
description = "Evidence-based Korean GHES weekly reports"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pydantic-settings>=2.8,<3", "sqlalchemy>=2.0,<3", "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4", "markdown-it-py>=3,<5", "bleach>=6,<7",
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-bleach", "types-Markdown"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
