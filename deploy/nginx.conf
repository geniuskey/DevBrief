server {
  listen 8080;
  server_name localhost;
  root /usr/share/nginx/html;
  client_max_body_size 64k;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'" always;
  location /api/ { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-User ""; proxy_set_header X-DevBrief-User ""; proxy_set_header X-DevBrief-Signature ""; proxy_set_header X-DevBrief-Timestamp ""; }
  location / { try_files $uri /index.html; }
}
