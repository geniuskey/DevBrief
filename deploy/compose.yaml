# Local PoC. API and UI share a network namespace so localhost-only auth is preserved.
services:
  migrate:
    build: {context: .., dockerfile: deploy/Dockerfile.backend}
    environment: &backend_env
      # One host, one worker: SQLite in a named volume shared by migrate/api/worker.
      # PostgreSQL: add `-f deploy/compose.postgres.yaml`.
      DATABASE_URL: sqlite:////data/devbrief.db
      ADAPTER_MODE: fake
      SINGLE_USER_MODE: 'true'
      PUBLIC_ORIGIN: http://localhost:8080
    command: [alembic, upgrade, head]
    volumes: [data:/data]
    read_only: true
    tmpfs: [/tmp]
  api:
    build: {context: .., dockerfile: deploy/Dockerfile.backend}
    environment: *backend_env
    ports: ['127.0.0.1:8080:8080']
    command: [uvicorn, app.main:app, --host, 127.0.0.1, --port, '8000', --no-proxy-headers]
    restart: unless-stopped
    depends_on: {migrate: {condition: service_completed_successfully}}
    volumes: [data:/data]
    read_only: true
    tmpfs: [/tmp]
  worker:
    build: {context: .., dockerfile: deploy/Dockerfile.backend}
    environment: *backend_env
    command: [python, -m, app.worker.runner]
    restart: unless-stopped
    depends_on: {migrate: {condition: service_completed_successfully}}
    volumes: [data:/data]
    read_only: true
    tmpfs: [/tmp]
  web:
    build: {context: .., dockerfile: deploy/Dockerfile.frontend}
    network_mode: service:api
    restart: unless-stopped
    depends_on: [api]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
volumes:
  data:
