name: validate
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.10.9', python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run pytest && uv run ruff check . && uv run mypy app && uv run alembic upgrade head && uv run alembic downgrade base && uv run alembic upgrade head
        working-directory: backend
      - run: npm ci && npm test && npm run lint && npm run build
        working-directory: frontend
